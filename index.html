<header class="site-header page-width"><div><p class="brand-note">具身智能 · 行业研究</p><h1>机器人与具身智能资料库</h1></div><span class="share-status">阅读分享版</span></header>

<section id="introView" class="view" data-page="intro" hidden><div class="view-heading"><div><h2>入门阅读</h2><p>从概念到场景，按顺序建立行业认识。从已开放的原件开始阅读。</p></div><span id="introCount" class="heading-count"></span></div><div id="introCards" class="cards"></div></section>

</main>

<script>/* Read-only view of the existing industry library. */
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const doc = JSON.parse($('data').textContent), data = doc.items;
  const byId = new Map(data.map(x => [x.id, x])), routes = new Map(doc.intro.map(x => [x.id,x]));
  const size = 12, storageKey = 'industry.directory.share.v1';
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem(storageKey) || '{}'); } catch (_) {}
  const state = {view:'questions',pool:'all',q:'',page:1,acquirePage:1,filters:{},...saved};
  const views = ['questions','intro','library','acquire'];
  if (!views.includes(state.view)) state.view = 'questions';
  if (!['all','core'].includes(state.pool)) state.pool = 'all';
  if (typeof state.q !== 'string') state.q = '';
  if (!state.filters || typeof state.filters !== 'object') state.filters = {};
  const sourceRecord = x => ['source_entry','excluded_history'].includes(x.kind);
  const fields = [
    ['content','内容用途',x=>sourceRecord(x)?'':x.content],
    ['format','材料形式',x=>sourceRecord(x)?'':x.format],
    ['availability','正文状态（库内持有）',x=>sourceRecord(x)?'':x.availability],
    ['source','来源类别',x=>x.source],
    ['year','年份',x=>sourceRecord(x)?'':x.year],
    ['language','语种',x=>x.languages],
    ['scene','应用场景',x=>x.scenes],
    ['form','具身形态',x=>x.forms]
  ];
  for (const k of Object.keys(state.filters)) if (![...fields.map(f=>f[0]),'sort'].includes(k)) delete state.filters[k];
  const searchable = new Map(data.map(x=>[x.id,[x.id,x.title,x.institution,x.content,x.format,x.year,x.source,...x.languages,...x.scenes,...x.forms].join(' ').toLowerCase()]));
  function persist() { try { localStorage.setItem(storageKey,JSON.stringify(state)); } catch (_) {} }
  function readHash() {
    const p = new URLSearchParams(location.hash.slice(1));
    if (views.includes(p.get('view'))) state.view = p.get('view');
    if (['all','core'].includes(p.get('pool'))) state.pool = p.get('pool');
    if (p.has('q')) { if (state.q!==p.get('q')) state.page = 1; state.q = p.get('q'); }
  }
  function updateUrl() {
    const p = new URLSearchParams({view:state.view});
    if (state.view==='library') { p.set('pool',state.pool); if (state.q) p.set('q',state.q); }
    const hash = '#'+p.toString();
    if (location.hash!==hash) history.replaceState(null,'',hash);
  }
  function matches(x, filters=state.filters) {
    if (state.pool==='core'&&!x.core) return false;
    const words = state.q.toLowerCase().trim().split(/\s+/).filter(Boolean);
    if (!words.every(w=>w.startsWith('id:')?x.id.toLowerCase()===w.slice(3):searchable.get(x.id).includes(w))) return false;
    return fields.every(([k,,get])=>!filters[k]||(Array.isArray(get(x))?get(x).includes(filters[k]):String(get(x))===filters[k]));
  }
  function filtered() {
    return data.filter(x=>matches(x)).sort((a,b)=>{
      if (state.filters.sort==='oldest') return (Number(a.year)||9999)-(Number(b.year)||9999)||a.id.localeCompare(b.id);
      if (state.filters.sort==='newest') return (Number(b.year)||0)-(Number(a.year)||0)||a.id.localeCompare(b.id);
      if (state.filters.sort==='institution') return a.institution.localeCompare(b.institution,'zh');
      return Number(b.core)-Number(a.core)||(Number(b.year)||0)-(Number(a.year)||0)||a.id.localeCompare(b.id);
    });
  }
  function tag(value, cls='', key='') {
    return value?'<span class="tag '+cls+'">'+(key?'<span class="tag-key">'+esc(key)+'</span>':'')+esc(value)+'</span>':'';
  }
  function card(x, route=null, target=null) {
    const source = sourceRecord(x), partial = x.availability!=='正文完整';
    let html = '<article class="material-card '+(route?'intro-card':'')+'" data-material-id="'+esc(x.id)+'">';
    if (route) html+='<p class="intro-prompt"><span class="step-number">'+String(route.order).padStart(2,'0')+'</span>'+esc(route.question)+'</p>';
    html+='<div class="card-heading"><h3 class="material-title" title="'+esc(x.title)+'">'+esc(x.title)+'</h3></div>';
    html+='<p class="card-meta"><span class="card-institution" title="'+esc(x.institution)+'">'+esc(x.institution)+'</span><span class="card-year">'+(source?'':esc(x.year))+'</span></p>';
    html+='<div class="tag-lines"><div class="tag-row">'+(source?tag('来源记录'):tag(x.content,'','内容')+tag(x.format,'','形式'))+'</div><div class="tag-row">'+(source?'':tag(x.availability,partial?'partial':'readable'))+tag(x.core?'核心':'普通',x.core?'core':'')+(x.kind==='report_alias'?tag('重复入口'):'')+'</div></div>';
    if (route) html+='<p class="intro-gain">'+esc(route.gain)+'</p><p class="intro-pages">建议重点：PDF '+esc(route.pages.join('、'))+'页</p>';
    if (target?.status) html+='<div class="tag-row">'+tag(target.status,target.status==='暂缓获取'?'partial':'')+'</div>';
    const file=x.files?.find(f=>f.primary)||x.files?.[0]||(x.external?{href:x.external}:null);
    html+='<div class="card-actions">'+(file?'<a class="open-original" target="_blank" rel="noopener" href="'+esc(file.href+(route&&file.pages?'#page='+route.pages[0]:''))+'">'+(x.external?'打开公开页面':route&&file.pages?'打开重点页':/\.(?:hwp|docx?|xlsx|csv)$/.test(file.href)?'下载原件':x.availability==='正文完整'?'打开原文':'打开现有内容')+'</a>':'<span class="file-status">'+(source?'来源记录':'原件尚未上线')+'</span>')+'<button type="button" class="quiet" data-details="'+esc(x.id)+'">详情</button></div></article>';
    return html;
  }
  function renderQuestions() {
    $('questionCards').innerHTML=doc.questions.map((q,n)=>'<details class="question-card"><summary><span class="question-number">'+String(n+1).padStart(2,'0')+'</span><span class="question-title">'+esc(q.title)+'</span></summary><div class="question-body"><p>'+esc(q.body)+'</p></div></details>').join('');
  }
  function render() {
    for (const el of document.querySelectorAll('[data-page]')) el.hidden=el.dataset.page!==state.view;
    for (const b of document.querySelectorAll('nav [data-view]')) { if (b.dataset.view===state.view) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current'); }
    $('allMaterials').setAttribute('aria-pressed',state.pool==='all'); $('coreNav').setAttribute('aria-pressed',state.pool==='core');
    $('libraryTotal').textContent=doc.counts.records.toLocaleString()+' 条登记 · '+doc.counts.core+' 条核心';
    $('introCount').textContent=doc.intro.length+' 份阅读安排';
    $('publicationNote').textContent=doc.publication_complete?'库内现有原件已全部上线，可直接打开阅读或下载。摘要、节选与完整正文按实际持有范围标注。':'原件正在分批上线，目前 '+doc.counts.readable+' 条材料可在线阅读。其余仍可浏览目录；摘要、节选与完整正文按实际持有范围标注。';
    $('footerCounts').textContent='共 '+doc.counts.records.toLocaleString()+' 条 · 目录更新 '+doc.snapshot;
    if (state.view==='intro') $('introCards').innerHTML=doc.intro.map(r=>card(byId.get(r.id),r)).join('');
    if (state.view==='library') {
      $('q').value=state.q;
      const rows=filtered(), max=Math.max(1,Math.ceil(rows.length/size));
      state.page=Math.max(1,Math.min(Number(state.page)||1,max));
      $('count').textContent=rows.length.toLocaleString()+' 条材料'+(state.q?' · 搜索结果':'');
      $('rows').innerHTML=rows.slice((state.page-1)*size,state.page*size).map(x=>card(x)).join('')||'<div class="empty">没有符合条件的材料。试试清空筛选或换个关键词。</div>';
      $('pageno').textContent=state.page+' / '+max; $('prev').disabled=state.page===1; $('next').disabled=state.page===max;
      const active=Object.values(state.filters).filter(Boolean).length;
      $('activeFilters').hidden=!active; $('filterSummary').textContent='已选 '+active+' 项';
      $('filterButtonLabel').textContent=active?'筛选 ('+active+')':'筛选';
    }
    if (state.view==='acquire') {
      const max=Math.max(1,Math.ceil(doc.targets.length/size));
      state.acquirePage=Math.max(1,Math.min(Number(state.acquirePage)||1,max));
      $('acquireCount').textContent=doc.targets.length+' 条不完整材料 · 暂缓获取 '+doc.targets.filter(t=>t.status==='暂缓获取').length+' · 不再追索 '+doc.targets.filter(t=>t.status==='不再追索').length;
      $('acquireCards').innerHTML=doc.targets.slice((state.acquirePage-1)*size,state.acquirePage*size).map(t=>card(byId.get(t.id),null,t)).join('')||'<p class="empty">暂无不完整材料。</p>';
      $('acquirePageNo').textContent=state.acquirePage+' / '+max;
      $('acquirePrev').disabled=state.acquirePage===1;$('acquireNext').disabled=state.acquirePage===max;
    }
    persist();
  }
  function paragraph(label, value) { return value?'<p><b>'+esc(label)+'：</b>'+esc(value)+'</p>':''; }
  function showDetails(id) {
    const x=byId.get(id); if (!x) return;
    const source=sourceRecord(x), route=routes.get(id);
    $('detailHeading').textContent=x.title;
    $('detailSubtitle').textContent=[x.institution,source?'':x.date,x.languages.join('、')].filter(Boolean).join(' · ');
    let html='<section class="detail-section"><h3>材料信息</h3><div class="tag-row">'+(source?tag('来源记录'):tag(x.content)+tag(x.format)+tag(x.availability))+tag(x.core?'核心':'普通',x.core?'core':'')+'</div>';
    html+=paragraph('来源类别',x.source)+paragraph('应用场景',x.scenes.join('、'))+paragraph('具身形态',x.forms.join('、'))+'</section>';
    if (source) html+='<section class="detail-section"><p>此条为来源或历史记录，用于追溯资料，不单独作为一份研究报告计数。</p></section>';
    if (x.related?.length) html+='<section class="detail-section"><h3>对应材料</h3>'+x.related.map(i=>'<p><button class="quiet" type="button" data-details="'+esc(i)+'">'+esc(byId.get(i)?.title||i)+'</button></p>').join('')+'</section>';
    if (x.value||x.focus||x.limit) html+='<section class="detail-section"><h3>阅读说明</h3>'+paragraph('阅读价值',x.value)+paragraph('阅读重点',x.focus)+paragraph('阅读时关注',x.limit)+'</section>';
    if (route) html+='<section class="detail-section"><h3>入门阅读安排</h3>'+paragraph('关注问题',route.question)+paragraph('读后收获',route.gain)+paragraph('阅读衔接',route.connection)+'<p class="reading-pages">建议重点：PDF '+esc(route.pages.join('、'))+'页</p></section>';
    html+='<section class="detail-section"><h3>现有原件</h3>'+(x.files?.length?'<ul>'+x.files.map(f=>'<li><a target="_blank" rel="noopener" href="'+esc(f.href)+'">'+esc(f.name)+(f.pages?' · '+f.pages+'页':'')+'</a>'+(f.primary?' <span class="small">主阅读文件</span>':'')+'</li>').join('')+'</ul>':x.external?'<p><a target="_blank" rel="noopener" href="'+esc(x.external)+'">打开机构公开页面</a>（外部网页，非本库保存的完整报告）</p>':source?'<p>此条为来源或历史记录，没有独立原件。</p>':'<p>此条原件尚未上线。</p>')+'<p class="small">材料编号：'+esc(x.id)+'</p></section>';
    $('detailContent').innerHTML=html;
    if (!$('detailDialog').open) $('detailDialog').showModal();
    $('detailDialog').scrollTop=0;
  }
  function openFilters() {
    $('filterFields').innerHTML=fields.map(([k,label,get])=>{
      const rest={...state.filters}; delete rest[k];
      const counts=new Map();
      for (const x of data.filter(x=>matches(x,rest))) {
        const vals=Array.isArray(get(x))?get(x):[get(x)];
        for (const value of new Set(vals.filter(Boolean))) counts.set(String(value),(counts.get(String(value))||0)+1);
      }
      if (state.filters[k]&&!counts.has(state.filters[k])) counts.set(state.filters[k],0);
      const order=doc.options[k]||[];
      const values=[...counts.keys()].sort((a,b)=>k==='year'?((Number(b)||0)-(Number(a)||0)||a.localeCompare(b,'zh')):(order.length?order.indexOf(a)-order.indexOf(b):a.localeCompare(b,'zh')));
      return '<label class="field">'+esc(label)+'<select data-filter="'+k+'"><option value="">不限</option>'+values.map(v=>'<option value="'+esc(v)+'"'+(state.filters[k]===v?' selected':'')+'>'+esc(v)+' ('+counts.get(v)+')</option>').join('')+'</select></label>';
    }).join('')+'<label class="field">排序<select data-filter="sort">'+[['','默认排序'],['newest','年份从新到旧'],['oldest','年份从旧到新'],['institution','按机构名称']].map(([v,label])=>'<option value="'+v+'"'+((state.filters.sort||'')===v?' selected':'')+'>'+label+'</option>').join('')+'</select></label>';
    $('filterDialog').showModal();
  }
  document.addEventListener('click',e=>{
    const close=e.target.closest('[data-close]'); if (close) { $(close.dataset.close).close(); return; }
    const detail=e.target.closest('[data-details]'); if (detail) { showDetails(detail.dataset.details); return; }
    const nav=e.target.closest('[data-view]');
    if (nav) { state.view=nav.dataset.view; updateUrl(); render(); window.scrollTo({top:0,behavior:'instant'}); return; }
    const pool=e.target.closest('[data-pool]');
    if (pool) { state.pool=pool.dataset.pool; state.page=1; updateUrl(); render(); }
  });
  $('q').addEventListener('input',()=>{state.q=$('q').value;state.page=1;updateUrl();render();});
  $('prev').addEventListener('click',()=>{state.page--;render();$('libraryView').scrollIntoView({block:'start'});});
  $('next').addEventListener('click',()=>{state.page++;render();$('libraryView').scrollIntoView({block:'start'});});
  $('acquirePrev').addEventListener('click',()=>{state.acquirePage--;render();$('acquireView').scrollIntoView({block:'start'});});
  $('acquireNext').addEventListener('click',()=>{state.acquirePage++;render();$('acquireView').scrollIntoView({block:'start'});});
  $('openFilters').addEventListener('click',openFilters);
  $('resetFilters').addEventListener('click',()=>{state.filters={};state.page=1;render();});
  $('clearFilterDraft').addEventListener('click',()=>{for (const el of $('filterFields').querySelectorAll('select')) el.value='';});
  $('filterForm').addEventListener('submit',e=>{
    e.preventDefault(); state.filters={};
    for (const el of $('filterFields').querySelectorAll('select[data-filter]')) if (el.value) state.filters[el.dataset.filter]=el.value;
    state.page=1;$('filterDialog').close();render();
  });
  for (const dialog of document.querySelectorAll('dialog')) dialog.addEventListener('click',e=>{if(e.target===dialog)dialog.close();});
  window.addEventListener('hashchange',()=>{readHash();render();});
  readHash();renderQuestions();updateUrl();render();
})();
</script>
</body>
</html>
